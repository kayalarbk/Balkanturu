<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Balkan Kaçamağı">
  <defs>
    <linearGradient id="gok" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2a45"/>
      <stop offset="55%" stop-color="#123a5c"/>
      <stop offset="100%" stop-color="#17879b"/>
    </linearGradient>
    <linearGradient id="deniz" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2fb3c4"/>
      <stop offset="100%" stop-color="#17879b"/>
    </linearGradient>
  </defs>

  <!-- Maskable güvenli alan: önemli her şey ortadaki %80'lik dairede -->
  <rect width="512" height="512" fill="url(#gok)"/>

  <!-- güneş -->
  <circle cx="352" cy="150" r="46" fill="#f4ece0" opacity=".92"/>

  <!-- dağ silueti (Balkanlar) -->
  <path d="M0 300 L96 206 L168 268 L246 180 L336 292 L410 236 L512 316 L512 512 L0 512 Z"
        fill="#0e3450"/>
  <path d="M246 180 L282 224 L214 224 Z" fill="#f4ece0" opacity=".85"/>

  <!-- deniz (Adriyatik) -->
  <path d="M0 336 L512 336 L512 512 L0 512 Z" fill="url(#deniz)"/>
  <path d="M0 372 q64 -22 128 0 t128 0 t128 0 t128 0 v24 q-64 22 -128 0 t-128 0 t-128 0 t-128 0 Z"
        fill="#f4ece0" opacity=".28"/>
  <path d="M0 432 q64 -22 128 0 t128 0 t128 0 t128 0 v24 q-64 22 -128 0 t-128 0 t-128 0 t-128 0 Z"
        fill="#f4ece0" opacity=".18"/>

  <!-- rota çizgisi ve duraklar -->
  <path d="M116 268 L206 240 L286 300 L392 330" fill="none" stroke="#f4ece0"
        stroke-width="9" stroke-linecap="round" stroke-dasharray="2 20" opacity=".9"/>
  <g fill="#f4ece0">
    <circle cx="116" cy="268" r="15"/>
    <circle cx="206" cy="240" r="15"/>
    <circle cx="286" cy="300" r="15"/>
    <circle cx="392" cy="330" r="15"/>
  </g>
</svg>
